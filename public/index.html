<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Tiểu Đường</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="script.js"></script>
</head>

<body>
    <div class="chat-container">
        <h2>🤖 Chatbot Tư Vấn Tiểu Đường</h2>
        <div id="chat-box"></div>
        <div class="input-section">
            <textarea id="message" placeholder="Nhập câu hỏi hoặc thông tin triệu chứng..."></textarea>
            <button onclick="sendMessage()">Gửi</button>
            <button class="reset" onclick="clearMessage()">Xóa</button>
        </div>
        <h3>📊 Dự đoán nguy cơ tiểu đường</h3>
        <div class="form-section">
            <label><span>Pregnancies (Số lần mang thai):</span> <input type="number" id="preg"></label>
            <label><span>Glucose (Nồng độ glucose):</span> <input type="number" id="glu"></label>
            <label><span>Blood Pressure (Huyết áp):</span> <input type="number" id="bp"></label>
            <label><span>Skin Thickness (Độ dày da):</span> <input type="number" id="skin"></label>
            <label><span>Insulin (Nồng độ insulin):</span> <input type="number" id="ins"></label>
            <label><span>BMI (Chỉ số khối cơ thể):</span> <input type="number" step="0.1" id="bmi"></label>
            <label><span>Diabetes Pedigree Function (Hàm phả hệ tiểu đường):</span> <input type="number" step="0.01"
                    id="dpf"></label>
            <label><span>Age (Tuổi):</span> <input type="number" id="age"></label>
            <div class="button-group">
                <button onclick="predictRisk()">Dự đoán</button>
                <button class="reset" onclick="resetForm()">Xóa</button>
            </div>
        </div>
    </div>
</body>

</html>
